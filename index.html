<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Đặt hàng TN-XLNT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=1.1.0">
</head>
<body>
<div id="devbar" class="devbar" hidden>MÔI TRƯỜNG THỬ – ĐĂNG NHẬP KHÔNG XÁC THỰC GOOGLE – KHÔNG DÙNG DỮ LIỆU THẬT</div>
<header class="top">
  <button type="button" class="iconbtn" id="menuBtn" aria-label="Mở menu" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand"><div class="brand-sub">ĐẶT HÀNG TN-XLNT</div><div class="brand-main" id="stationName">Quản lý tài sản</div></div>
  <div class="top-right">
    <span id="net" class="chip chip-ok">Trực tuyến</span>
    <button type="button" class="iconbtn" id="bellBtn" aria-label="Thông báo" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
      <span id="bellCount" class="badge" hidden>0</span>
    </button>
  </div>
</header>
<div class="layout">
  <nav id="nav" class="nav" hidden></nav>
  <main id="app" class="main" tabindex="-1"><div class="loading">Đang tải…</div></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="config.js?v=1.1.0"></script>
<script src="app.js?v=1.1.0"></script>
</body>
</html>
